<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Amalfi · Prova di nitidezza</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;color:#25241f;background:#faf9f6;max-width:860px;margin:auto;padding:24px}h1{font:normal clamp(38px,7vw,64px)/1 Georgia,serif;margin:.35em 0}p{max-width:60ch}main button{padding:0;border:0;background:none;cursor:zoom-in}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}section img{display:block;width:100%;height:auto}dialog{background:#171715;color:#fff;border:0;margin:0;width:100%;height:100dvh;max-width:none;max-height:none;padding:0}dialog[open]{display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px}header button{background:#33332f;border:1px solid #777;color:white;border-radius:4px;padding:8px;min-height:44px;cursor:pointer}button[aria-pressed=true]{color:#171715;background:#fff}button:focus-visible{outline:3px solid #edaa48;outline-offset:1px}#status{font-size:14px;padding:0 10px}#frame{flex:1;min-height:0;overflow:auto;text-align:center}#frame img{display:block;margin:auto;width:100%;height:100%;object-fit:contain}#frame.detail img{width:max(150%,960px);height:auto;max-width:none}body:has(dialog[open]){overflow:hidden}
</style><main><small>NICOLA CAPASSO · ANTEPRIMA</small><h1>Amalfi</h1><p>Tocca uno dei tre scatti. Passa da <b>Attuale</b> a <b>Più nitida</b> per confrontare la stessa foto. Con <b>Dettaglio</b> puoi ingrandire e scorrere l’immagine.</p><section aria-label="Tre foto di Amalfi">
<button aria-label="Apri la prima fotografia"><img alt="Amalfi, prima fotografia" width="1280" height="1920" src="../assets/stories/amalfi/01.jpg"></button>
<button aria-label="Apri la seconda fotografia"><img alt="Amalfi, seconda fotografia" width="1280" height="1920" src="../assets/stories/amalfi/02.jpg"></button>
<button aria-label="Apri la terza fotografia"><img alt="Amalfi, terza fotografia" width="1280" height="1920" src="../assets/stories/amalfi/03.jpg"></button>
</section></main><dialog aria-label="Confronto fotografico"><header><button id="before">Attuale</button><button id="after">Più nitida</button><button id="zoom" aria-pressed="false">Dettaglio</button><button id="close">Chiudi</button></header><span id="status" role="status"></span><div id="frame"><img id="photo" alt=""></div></dialog>
<script>
const el=id=>document.getElementById(id), dialog=document.querySelector('dialog');let thumb,request=0;
async function show(hd){const ticket=++request;el('status').textContent=hd?'Caricamento della foto più nitida…':'';const url=hd?new URL(thumb.src).pathname.split('/').pop().replace('.jpg','.webp'):thumb.src;const next=new Image();next.src=url;try{await next.decode();if(ticket!==request)return;el('photo').src=next.src;el('before').setAttribute('aria-pressed',String(!hd));el('after').setAttribute('aria-pressed',String(hd));el('status').textContent=hd?'Più nitida · 2880 px':'Attuale · 1920 px';}catch{if(ticket===request)el('status').textContent='Foto non caricata. Riprova o scegli Attuale.';}}
document.querySelectorAll('main button').forEach(button=>button.onclick=()=>{thumb=button.querySelector('img');el('photo').src=thumb.src;el('photo').alt=thumb.alt;el('before').setAttribute('aria-pressed','true');el('after').setAttribute('aria-pressed','false');el('zoom').setAttribute('aria-pressed','false');el('frame').classList.remove('detail');dialog.showModal();show(true);});
el('before').onclick=()=>show(false);el('after').onclick=()=>show(true);el('close').onclick=()=>dialog.close();dialog.onclose=()=>{++request;};el('zoom').onclick=()=>{const f=el('frame'),on=f.classList.toggle('detail');el('zoom').setAttribute('aria-pressed',String(on));if(on){f.scrollTop=(f.scrollHeight-f.clientHeight)/2;f.scrollLeft=(f.scrollWidth-f.clientWidth)/2;}};
</script></html>
